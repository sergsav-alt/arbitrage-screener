spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/arbitrage_screener
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jooq:
    sql-dialect: POSTGRES
  liquibase:
    enable: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

exchanges:
  bingx:
    enabled: true
    ws-url: wss://open-api-ws.bingx.com/market
  mexc:
    enabled: true
    ws-url: wss://wbs-api.mexc.com/ws

symbols: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,ADAUSDT,DOGEUSDT

arbitrage:
  min-spread-percent: 0.1
  ttl-seconds: 30
  scan-interval-ms: 1000
  default-trade-volume-usdt: 100
  min-trade-volume-usdt: 10

fees:
  taker-percent:
    bingx: 0.1
    mexc: 0.1
  withdrawal:
    per-symbol:
      USDT:
        bingx: 1.0
        mexc: 2.0
    default-usdt: 2.0

reconnect:
  initial-delay-seconds: 1
  max-delay-seconds: 60
  ping-interval-seconds: 180

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

statistics:
  collect-interval-ms: 60000

logging:
  level:
    com.arbitrage.screener: INFO
